15","MW","3103","T"]]]]],["COMPUTER VISION & PATTERN RECOGNITION",[["A",[["11:30-1:00","ST","3109","T"]]],["B",[["1:15-2:45","MW","3103","T"]]],["C",[["1:15-2:45","ST","3120","T"]]],["D",[["11:30-1:00","MW","3102","T"]]],["E",[["1:15-2:45","MW","3111","T"]]],["F",[["1:15-2:45","ST","3104","T"]]],["G",[["1:15-2:45","MW","3207","T"]]],["H",[["9:45-11:15","ST","3207","T"]]]]]];

function parseDays(s){if(!s)return[];const d=[];let i=0;const u=s.toUpperCase();while(i<u.length){if(u[i]==='T'&&u[i+1]==='H'){d.push("Thu");i+=2}else if(u[i]==='S'){d.push("Sun");i++}else if(u[i]==='M'){d.push("Mon");i++}else if(u[i]==='T'){d.push("Tue");i++}else if(u[i]==='W'){d.push("Wed");i++}else if(u[i]==='F'){d.push("Fri");i++}else i++}return d}
function parseTime(s){if(!s)return null;const c=s.replace(/\s/g,"").replace(/AM|PM/gi,"").replace(/[–—]/g,"-");const p=c.split("-");if(p.length<2)return null;const toM=t=>{if(!t)return 0;const sg=t.split(/[:.]/);const h=parseInt(sg[0],10)||0;const m=parseInt(sg[1],10)||0;return(h<8?h+12:h)*60+m};const st=toM(p[0]),en=toM(p[1]);return en>st?{start:st,end:en}:null}
function parseSlots(raw){const o=[];for(const[time,day,room,type]of raw){const p=parseTime(time);if(!p)continue;const days=parseDays(day);if(!days.length)continue;o.push({time,day,room,type,start:p.start,end:p.end,days})}return o}
function clash(a,b){for(const sa of a)for(const sb of b)for(const da of sa.days)if(sb.days.includes(da)&&sa.start<sb.end&&sb.start<sa.end)return true;return false}
function fmtT(m){let h=Math.floor(m/60),mn=m%60;const ap=h>=12?"PM":"AM";if(h>12)h-=12;if(h===0)h=12;return h+":"+String(mn).padStart(2,"0")+" "+ap}
function fmtS(m){let h=Math.floor(m/60),mn=m%60;const ap=h>=12?"PM":"AM";if(h>12)h-=12;if(h===0)h=12;return h+":"+String(mn).padStart(2,"0")+ap}

const ALL=D.map((c,i)=>({id:i,name:c[0],sections:c[1].map(([sec,raw])=>({sec,slots:parseSlots(raw)}))}));

function calcGap(combo){let t=0;for(const day of DAYS){const sl=[];combo.forEach(c=>c.slots.forEach(s=>{if(s.days.includes(day))sl.push(s)}));sl.sort((a,b)=>a.start-b.start);for(let i=1;i<sl.length;i++)t+=Math.max(0,sl[i].start-sl[i-1].end)}return t}

function generate(courses,opts){
  const{earliest,latest,daysOnly,sortGaps}=opts;
  const filtered=courses.map(c=>({...c,sections:c.sections.filter(sec=>{
    for(const sl of sec.slots){if(sl.start<earliest||sl.end>latest)return false;if(daysOnly.length>0&&!sl.days.every(d=>daysOnly.includes(d)))return false}
    return sec.slots.length>0
  })}));
  const results=[];
  function bt(ci,chosen){
    if(results.length>=500)return;
    if(ci>=filtered.length){results.push([...chosen]);return}
    for(const sec of filtered[ci].sections){
      let ok=true;
      for(const prev of chosen)if(clash(sec.slots,prev.slots)){ok=false;break}
      if(ok){chosen.push({courseId:filtered[ci].id,name:filtered[ci].name,sec:sec.sec,slots:sec.slots});bt(ci+1,chosen);chosen.pop()}
    }
  }
  bt(0,[]);
  if(sortGaps==="min")results.sort((a,b)=>calcGap(a)-calcGap(b));
  return results;
}

const SH=8,EH=24,TM=(EH-SH)*60;

function TT({entries,colorMap}){
  return(
    <div style={{overflow:"auto",flex:1}}>
      <div className="tgrid">
        <div className="thdr"/>
        {DAYS.map(d=><div key={d} className="thdr">{d}</div>)}
        <div style={{position:"relative"}}>
          {HOURS.map(h=><div key={h} className="hlbl" style={{top:`${((h-SH)*60/TM)*100}%`}}>{fmtT(h*60)}</div>)}
        </div>
        {DAYS.map((day,di)=>(
          <div key={day} className="dcol" style={{background:di%2===0?"#0c151e":"#0f1923"}}>
            {HOURS.map(h=><div key={h} className="hline" style={{top:`${((h-SH)*60/TM)*100}%`}}/>)}
            {entries.filter(e=>e.days.includes(day)).map((e,i)=>{
              const top=((e.start-SH*60)/TM)*100;
              const ht=Math.max(((e.end-e.start)/TM)*100,2.5);
              const bg=colorMap[e.courseId]||"#666";
              return(
                <div key={i} className="blk" title={`${e.name} [Sec ${e.sec}]\n${fmtS(e.start)} - ${fmtS(e.end)}\nRoom: ${e.room}\n${e.type==='T'?'Theory':e.type==='L'?'Lab':'Extra'}`}
                  style={{top:`${top}%`,height:`${ht}%`,background:`linear-gradient(135deg,${bg},${bg}cc)`}}>
                  <div className="nm">{e.name}</div>
                  <div className="mt">Sec {e.sec} · {e.room}</div>
                  {ht>4.5&&<div className="mt">{fmtS(e.start)}–{fmtS(e.end)}</div>}
                </div>
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

  const cur=routines[rIdx]||[];
  const{entries,colorMap}=useMemo(()=>{
    const cm={};picked.forEach((id,i)=>{cm[id]=PAL[i%PAL.length]});
    const ents=[];
    for(const r of cur)for(const sl of r.slots)for(const day of sl.days)
      ents.push({courseId:r.courseId,name:r.name,sec:r.sec,room:sl.room,type:sl.type,start:sl.start,end:sl.end,days:[day]});
    return{entries:ents,colorMap:cm};
  },[cur,picked]);

  const isBk=cur.length>0&&bookmarks.some(b=>JSON.stringify(b)===JSON.stringify(cur));
  const togBk=()=>{
    if(!cur.length)return;
    if(isBk){setBookmarks(p=>p.filter(b=>JSON.stringify(b)!==JSON.stringify(cur)));show("Removed","#f59e0b")}
    else{setBookmarks(p=>[...p,cur]);show("Bookmarked! ★")}
  };
  const loadBk=(bm,bi)=>{
    const ids=[...new Set(bm.map(r=>r.courseId))];
    setPicked(ids);setRoutines([bm]);setRIdx(0);setView("gen");show(`Loaded #${bi+1}`);
  };

  const tOpts=[];for(let h=8;h<=23;h++)tOpts.push({v:h*60,l:fmtT(h*60)});

  return(
    <>
    <style>{css}</style>
    <div className="wrap">
      <div className="sidebar">
        <div style={{fontSize:18,fontWeight:900,color:"#38bdf8",marginBottom:10,fontFamily:"monospace"}}>R</div>
        {[["gen","📅"],["bk","🔖"],["info","ℹ️"]].map(([v,ic])=>(
          <button key={v} className={`sb-btn${view===v?" act":""}`} onClick={()=>setView(v)}>{ic}</button>
        ))}
      </div>
      <div className="main-col">
        <div className="topbar">
          <div>
            <span style={{fontWeight:800,fontSize:15,color:"#e0e6ed"}}>AIUB Routine Generator</span>
            <span className="badge" style={{background:"#0c2a3f",color:"#38bdf8"}}>Fall 2026-27</span>
          </div>
          <div style={{fontSize:12,color:"#5a7a94"}}>
            {picked.length} course{picked.length!==1?"s":""}
            {routines.length>0&&<span style={{marginLeft:10,color:"#22c55e"}}>● {routines.length} routine{routines.length!==1?"s":""}</span>}
          </div>
        </div>

        {view==="gen"&&(
          <div className="body">
            <div className="mob-panel-toggle" onClick={()=>setMobPanel(p=>!p)}>
              {mobPanel?"▲ Hide Options":"▼ Courses & Options"}
            </div>
            <div className={`lpanel${mobPanel?"":" collapsed"}`}>
              <div className="phdr" onClick={()=>setShowC(!showC)}>
                <span>📚 Add Courses</span><span>{showC?"▾":"▸"}</span>
              </div>
              {showC&&(
                <div style={{padding:"10px 12px",borderBottom:"1px solid #1a2a3a"}}>
                  {avail.length>0&&(
                    <div style={{maxHeight:180,overflowY:"auto",background:"#0a1219",border:"1px solid #1a2a3a",borderRadius:7,marginBottom:8}}>
                      {avail.map(c=>(
                        <div key={c.id} className="ditem" onClick={()=>add(c.id)}>
                          <div><div style={{fontWeight:600,fontSize:13}}>{c.name}</div><div style={{fontSize:10,color:"#5a7a94"}}>{c.sections.length} sections</div></div>
                          <span style={{color:"#38bdf8",fontSize:17}}>+</span>
                        </div>
                      ))}
                    </div>
                  )}
                  {avail.length===0&&picked.length===ALL.length&&<div style={{fontSize:12,color:"#22c55e",padding:8,textAlign:"center"}}>All courses added ✓</div>}
                  {picked.length>0&&(
                    <div style={{display:"flex",flexWrap:"wrap",marginTop:4}}>
                      {pickeds.map((c,i)=>(
                        <span key={c.id} className="ctag" style={{background:PAL[i%PAL.length]+"18",borderColor:PAL[i%PAL.length]+"55",color:PAL[i%PAL.length]}}>
                          {c.name.length>28?c.name.slice(0,26)+"…":c.name}
                          <button className="tx" onClick={()=>rm(c.id)}>×</button>
                        </span>
                      ))}
                    </div>
                  )}
                  <div style={{marginTop:6,fontSize:11,color:"#5a7a94"}}>[ Total Courses: {picked.length} ]</div>
                </div>
              )}

              <div className="phdr" onClick={()=>setShowO(!showO)}>
                <span>⚙️ Generate Options</span><span>{showO?"▾":"▸"}</span>
              </div>
              {showO&&(
                <div style={{borderBottom:"1px solid #1a2a3a",paddingBottom:4}}>
                  <div className="orow"><span>Earliest Start</span>
                    <select className="osel" value={earliest} onChange={e=>setEarliest(+e.target.value)}>{tOpts.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}</select>
                  </div>
                  <div className="orow"><span>Latest End</span>
                    <select className="osel" value={latest} onChange={e=>setLatest(+e.target.value)}>{tOpts.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}</select>
                  </div>
                  <div className="orow" style={{flexDirection:"column",alignItems:"flex-start",gap:4}}><span>Classes Only On</span></div>
                  <div className="dchecks">
                    {DAYS.map(d=><label key={d} className={`dchk${daysOnly.includes(d)?" on":""}`} onClick={()=>togDay(d)}>{d}</label>)}
                  </div>
                  <div className="orow"><span>Sort by Gaps?</span>
                    <select className="osel" value={sortGaps} onChange={e=>setSortGaps(e.target.value)}>
                      <option value="min">Minimize Gaps</option><option value="none">No Preference</option>
                    </select>
                  </div>
                  <button className="gbtn" onClick={doGen} disabled={busy||!picked.length}>{busy?"⏳ Generating...":"⚡ Generate Routines"}</button>
                  {!picked.length&&<div style={{textAlign:"center",fontSize:11,color:"#5a7a94",paddingBottom:6}}>Add courses first</div>}
                </div>
              )}
            </div>

            <div className="rpanel">
              {entries.length===0?(
                <div className="empty">
                  <div style={{fontSize:44}}>📅</div>
                  <div style={{fontSize:14,fontWeight:600}}>Your routine will appear here</div>
                  <div style={{fontSize:12}}>Add courses → set options → generate</div>
                </div>
              ):(
                <TT entries={entries} colorMap={colorMap}/>
              )}
              {routines.length>0&&(
                <div className="navbar">
                  <button className="nbtn" disabled={rIdx===0} onClick={()=>setRIdx(i=>i-1)}>◀ Prev</button>
                  <span style={{fontWeight:700,fontSize:15,color:"#e0e6ed",minWidth:65,textAlign:"center"}}>{rIdx+1} / {routines.length}</span>
                  <button className="nbtn" disabled={rIdx>=routines.length-1} onClick={()=>setRIdx(i=>i+1)}>Next ▶</button>
                  <button className={`bkb${isBk?" sv":""}`} onClick={togBk}>{isBk?"★":"☆"}</button>
                </div>
              )}
            </div>
          </div>
        )}

        {view==="bk"&&(
          <div style={{padding:20,maxWidth:800,margin:"0 auto",flex:1,overflowY:"auto"}}>
            <h2 style={{fontSize:17,fontWeight:700,marginBottom:14,color:"#c8d6e0"}}>🔖 Bookmarked Routines</h2>
            {bookmarks.length===0?(
              <div className="empty" style={{padding:30}}><div style={{fontSize:36}}>🔖</div><div>No bookmarks yet</div><div style={{fontSize:12}}>Generate routines and click ☆ to save</div></div>
            ):(
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {bookmarks.map((bm,bi)=>(
                  <div key={bi} style={{background:"#12202e",border:"1px solid #1a2a3a",borderRadius:10,padding:14,cursor:"pointer"}} onClick={()=>loadBk(bm,bi)}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                      <span style={{fontWeight:700,color:"#38bdf8",fontSize:14}}>Routine #{bi+1}</span>
                      <button style={{background:"none",border:"none",color:"#ef4444",fontSize:15,cursor:"pointer"}}
                        onClick={e=>{e.stopPropagation();setBookmarks(p=>p.filter((_,i)=>i!==bi));show("Deleted","#ef4444")}}>✕</button>
                    </div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                      {bm.map((r,ri)=>(
                        <span key={ri} style={{padding:"3px 9px",borderRadius:6,fontSize:11,fontWeight:600,background:PAL[ri%PAL.length]+"22",color:PAL[ri%PAL.length],border:`1px solid ${PAL[ri%PAL.length]}44`}}>
                          {r.name} (Sec {r.sec})
                        </span>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {view==="info"&&(
          <div style={{padding:20,maxWidth:650,margin:"0 auto",flex:1}}>
            <h2 style={{fontSize:17,fontWeight:700,marginBottom:14,color:"#c8d6e0"}}>ℹ️ How to Use</h2>
            <div style={{background:"#12202e",border:"1px solid #1a2a3a",borderRadius:10,padding:18,lineHeight:1.8,fontSize:13,color:"#a0b4c4"}}>
              <p><strong style={{color:"#38bdf8"}}>1.</strong> Click <strong style={{color:"#e0e6ed"}}>+ </strong> next to a course to add it. Remove with ×.</p>
              <p style={{marginTop:10}}><strong style={{color:"#38bdf8"}}>2.</strong> Set your preferred earliest start, latest end, and which days you want.</p>
              <p style={{marginTop:10}}><strong style={{color:"#38bdf8"}}>3.</strong> Hit <strong style={{color:"#e0e6ed"}}>Generate Routines</strong> — finds all clash-free section combos (up to 500).</p>
              <p style={{marginTop:10}}><strong style={{color:"#38bdf8"}}>4.</strong> Use <strong style={{color:"#e0e6ed"}}>◀ Prev / Next ▶</strong> to browse. Each is a unique valid schedule.</p>
              <p style={{marginTop:10}}><strong style={{color:"#38bdf8"}}>5.</strong> Click <strong style={{color:"#f59e0b"}}>☆</strong> to bookmark. View saved routines in 🔖.</p>
              <hr style={{border:"none",borderTop:"1px solid #1a2a3a",margin:"14px 0"}}/>
              <p style={{fontSize:11,color:"#5a7a94"}}>Courses loaded from five_courses_one_sheet.xlsx · 5 courses, 67 sections · Days: S=Sun, M=Mon, T=Tue, W=Wed, TH=Thu</p>
            </div>
          </div>
        )}
      </div>
    </div>
    <div className="mob-bottom">
      {[["gen","📅"],["bk","🔖"],["info","ℹ️"]].map(([v,ic])=>(
        <button key={v} className={`sb-btn${view===v?" act":""}`} onClick={()=>setView(v)}>{ic}</button>
      ))}
    </div>
    {toast&&<div className="toast" style={{background:toast.color+"22",color:toast.color,border:`1px solid ${toast.color}55`}}>{toast.msg}</div>}
    </>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
